name: Update formulae

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-formulae
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test updater
        run: python3 -B -m unittest discover -s .github/scripts -v
      - name: Check upstream releases and update formulae
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B .github/scripts/update_formulae.py
      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet -- Formula/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          name: updated-formulae
          path: Formula/
          if-no-files-found: error
          retention-days: 7

  validate:
    needs: check
    if: needs.check.outputs.changed == 'true'
    uses: ./.github/workflows/tests.yml
    with:
      formula-artifact: updated-formulae

  publish:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: updated-formulae
          path: Formula
      - name: Commit and publish validated updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Formula/
          git commit -m "chore: update Homebrew formulae" \
            -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin HEAD:main
