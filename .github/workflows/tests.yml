name: Test formula

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: mp3blstr (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@master
      - name: Tap checked-out revision
        run: brew tap --custom-remote mingcheng/tap "$GITHUB_WORKSPACE"
      - name: Check formula style
        run: brew style mingcheng/tap/mp3blstr
      - name: Install
        run: brew install mingcheng/tap/mp3blstr
      - name: Test
        run: brew test mingcheng/tap/mp3blstr
